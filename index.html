<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>בונה המקדש</title>
<link rel="icon" href="assets/icon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #0a0806;
    font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 40%, #1a1410 0%, #0a0806 70%);
  }

  #game {
    display: block;
    background: #000;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(201, 162, 39, 0.25);
  }

  #boot {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #c9a227;
    background: #0a0806;
    z-index: 10;
    transition: opacity 0.4s;
  }

  #boot h1 {
    font-size: 34px;
    letter-spacing: 2px;
    font-weight: 600;
  }

  #boot p { color: #6b5a3a; font-size: 14px; }

  #boot.hidden { opacity: 0; pointer-events: none; }

  #boot .err {
    color: #d4604a;
    font-size: 13px;
    max-width: 560px;
    text-align: center;
    line-height: 1.7;
    direction: ltr;
    font-family: monospace;
  }

  #touch-pad {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8;
    pointer-events: none;
  }
  #touch-pad.visible { display: block; }

  #touch-pad .tb-cluster {
    position: absolute;
    display: flex;
    gap: 10px;
    pointer-events: none;
    align-items: flex-end;
  }
  #touch-pad .tb-left {
    left: max(10px, env(safe-area-inset-left));
    bottom: max(12px, env(safe-area-inset-bottom));
  }
  #touch-pad .tb-right {
    right: max(8px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    justify-content: flex-end;
  }
  #touch-pad .tb-top {
    top: max(8px, env(safe-area-inset-top));
    right: max(8px, env(safe-area-inset-right));
  }

  #touch-pad .tb-btn {
    pointer-events: auto;
    width: 64px;
    height: 64px;
    border: 1px solid rgba(201, 162, 39, 0.55);
    border-radius: 16px;
    background: rgba(18, 16, 12, 0.72);
    color: #f0e2c0;
    font: 700 15px "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  #touch-pad .tb-btn small {
    font-size: 10px;
    font-weight: 500;
    color: #c9b07a;
  }
  #touch-pad .tb-btn.held,
  #touch-pad .tb-btn:active {
    background: rgba(201, 162, 39, 0.38);
    transform: scale(0.96);
  }
  #touch-pad .tb-jump {
    width: 78px;
    height: 78px;
    border-radius: 39px;
    background: rgba(201, 162, 39, 0.32);
  }
  #touch-pad .tb-move { width: 68px; height: 68px; }
  #touch-pad .tb-small { width: 56px; height: 56px; font-size: 13px; }
  #touch-pad .tb-icon { width: 42px; height: 42px; border-radius: 12px; font-size: 13px; }

  #touch-pad [hidden] { display: none !important; }
  body.tb-touch { --touch-space: 176px; }
  body.tb-touch #stage {
    top: env(safe-area-inset-top);
    bottom: env(safe-area-inset-bottom);
    left: env(safe-area-inset-left);
    right: env(safe-area-inset-right);
  }
  #touch-pad .tb-left, #touch-pad .tb-right {
    display: flex;
    gap: 4px;
  }
  #touch-pad .tb-left .tb-small { grid-column: span 2; justify-self: center; }
  #touch-pad .tb-btn, #touch-pad .tb-jump, #touch-pad .tb-move, #touch-pad .tb-small {
    width: 44px; height: 44px; min-width: 44px; min-height: 44px;
    background: rgba(13, 38, 52, 0.55);
    border-color: rgba(249, 216, 143, 0.8);
  }
  #touch-pad .tb-top { position: fixed; display: flex; gap: 6px; }
  #touch-pad .tb-top .tb-btn { width: auto; height: 44px; min-height: 44px; padding: 0 10px; font-size: 12px; }
  #touch-pad .tb-touch-hint {
    display: none; position: absolute; bottom: calc(150px + env(safe-area-inset-bottom));
    left: 8px; right: 8px; text-align: center; color: #c9d8e4; font-size: 11px;
  }

  body.tb-touch #voice-toggle {
    left: max(8px, env(safe-area-inset-left)) !important;
    top: max(8px, env(safe-area-inset-top));
    bottom: auto !important;
    z-index: 12;
    min-height: 44px;
  }

  @media (orientation: landscape) {
    body.tb-touch { --touch-space: 84px; }
    #touch-pad .tb-top { left: 50%; right: auto; transform: translateX(-50%); }
    #touch-pad .tb-left, #touch-pad .tb-right { display: flex; gap: 8px; }
    #touch-pad .tb-btn, #touch-pad .tb-jump, #touch-pad .tb-move, #touch-pad .tb-small {
      width: 58px; height: 58px; font-size: 14px;
    }
    #touch-pad .tb-touch-hint { display: none; }
  }
  @media (orientation: landscape) and (min-width: 780px) {
    body.tb-touch #stage {
      top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
    }
    #touch-pad .tb-left, #touch-pad .tb-right { display: flex; }
    #touch-pad .tb-top { flex-wrap: nowrap; justify-content: flex-end; }
  }
  #entry-menu-controls[hidden] { display: none !important; }
  #entry-menu-controls {
    position: fixed; z-index: 9;
    bottom: max(8px, env(safe-area-inset-bottom));
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    max-width: 560px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  #entry-menu-controls button {
    min-height: 44px; padding: 6px 12px; border: 1.5px solid #d4ad65; border-radius: 10px;
    background: linear-gradient(#145874, #082d46); color: #fff0cb;
    font: 700 16px "Segoe UI", Arial, sans-serif;
    touch-action: manipulation; cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
  }
  #entry-menu-controls .entry-primary { grid-column: span 2; font-size: 21px; min-height: 48px; }
  #entry-menu-controls .entry-reset { grid-column: span 2; background: #182f3b; font-size: 13px; }
  #entry-menu-controls button:focus-visible { outline: 3px solid #fff1bc; outline-offset: 2px; }
  #entry-menu-controls button:active { background: #23718b; }
  body.tb-touch.tb-entry-menu #stage {
    left: env(safe-area-inset-left); right: env(safe-area-inset-right);
    top: calc(56px + env(safe-area-inset-top));
    bottom: calc(var(--entry-space, 116px) + env(safe-area-inset-bottom));
  }
  body.tb-entry-menu #touch-pad .tb-touch-hint { display: none; }
  body.tb-entry-menu { background: #0b2537; }
  body.tb-entry-menu #stage {
    background: radial-gradient(ellipse at center, #193e54 0%, #0b2537 70%);
  }
  @media (orientation: landscape) {
    #entry-menu-controls[data-count="4"] { grid-template-columns: repeat(3, 1fr); }
    #entry-menu-controls[data-count="4"] .entry-primary { grid-column: span 3; }
    #entry-menu-controls[data-count="4"] .entry-reset { grid-column: auto; }
    body.tb-touch.tb-entry-menu #stage { bottom: calc(116px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
  </div>

  <div id="boot">
    <h1>בּוֹנֵה הַמִּקְדָּשׁ</h1>
    <p>טוֹעֵן…</p>
  </div>

  <script type="module">
    import { boot } from './src/main.js';

    const bootEl = document.getElementById('boot');

    try {
      await boot(document.getElementById('game'));
      bootEl.classList.add('hidden');
      setTimeout(() => bootEl.remove(), 500);
    } catch (err) {
      bootEl.innerHTML =
        '<h1>שְׁגִיאַת טְעִינָה</h1>' +
        '<div class="err">' + String(err && err.stack || err) + '</div>';
      console.error(err);
    }
  </script>
</body>
</html>
